  <script>
document.addEventListener('DOMContentLoaded', () => {
    const flowerLogo = document.querySelector('.img-1');
    
    function createHeartTrail() {
        const rect = flowerLogo.getBoundingClientRect();
        const p = document.createElement('div');
        p.className = 'particle';
        
        // Use Gold and Rose Pink for the heart
        const colors = ['#D4AF37', '#E91E63'];
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        
        // Position at the center of your moving flower
        p.style.left = (rect.left + rect.width / 2) + 'px';
        p.style.top = (rect.top + rect.height / 2) + 'px';
        
        document.body.appendChild(p);
    }

    // Draw a dot every 20ms for a smooth line
    let drawInterval = setInterval(createHeartTrail, 20);

    // Clear all dots every 10 seconds to start the heart again
    setInterval(() => {
        const dots = document.querySelectorAll('.particle');
        dots.forEach(dot => dot.remove());
    }, 10000); 
});
</script>
