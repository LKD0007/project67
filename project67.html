<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Document</title>
</head>
<body>

    <div class="container-fluid bg-light border-bottom sticky-top">
        <div class="row align-items-center">
            <div class="col-2">
                <img src="images/logo.webp" alt="Logo" class="img-fluid" style="max-height: 50px;">
            </div>
            <div class="col-10">
                <nav class="navbar navbar-light bg-light sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Menu</a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#collapsibleNavbar" aria-controls="collapsibleNavbar" 
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="collapsibleNavbar">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="#home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#Project">Project</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#Aboutus">Log in</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
            </div>
        </div>
    </div>

    <div class="container mt-4" id="home">
        <div class="row"> 
            <div class="col-sm-6 col-md-8"><img src="images/1.webp" class="img-fluid rounded" alt=""></div>
            <div class="col-sm-6 col-md-10"><img src="images/2.jpg" class="img-fluid rounded" alt=""></div>
            <div class="col-sm-6 col-md-8"><img src="images/3.webp" class="img-fluid rounded" alt=""></div>
            <div class="col-sm-6 col-md-10"><img src="images/4.jpg" class="img-fluid rounded" alt=""></div>
            <div class="col-sm-6 col-md-10"><img src="images/6.webp" class="img-fluid rounded" alt=""></div>
            <div class="col-sm-6 col-md-8"><img src="images/5.jpg" class="img-fluid rounded" alt=""></div>
            <div class="col-sm-6 col-md-8"><img src="images/7.webp" class="img-fluid rounded" alt=""></div>
            <div class="col-sm-6 col-md-8"><img src="images/8.avif" class="img-fluid rounded" alt=""></div>
        </div>
    </div>

    <div class="container mt-5 mb-5" id="Aboutus">
        <div class="row justify-content-center">
            <div class="col-md-6 border p-4 shadow-sm rounded">
                <h1 class="text-center">Login</h1>
                <form>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="Email id">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" placeholder="Password">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" placeholder="Name">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Submit</button>
                </form>
            </div>
        </div>
    </div>
    <div class="container-fluid" id="Project">
        <div class="row">
            <div class="row justify-content-center">
            <div class="col-md-6 border p-4 shadow-sm rounded">
                <div class="mb-3">
                    <label for="" class="form-label">Project idea:</label>
                    <textarea name="" id="" cols="40" rows="5" class="form-control" placeholder="Project idea"></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">Submit</button>
            </div>
            </div>
        </div>
    </div>
</body>
</html>
